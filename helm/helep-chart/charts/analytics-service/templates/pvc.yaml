apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: analytics-service-data
  namespace: {{ .Release.Namespace }}
  labels:
    app: analytics-service
    app.kubernetes.io/part-of: helep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
