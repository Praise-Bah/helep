replicaCount: 2
image:
  repository: helep/notification-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  port: 8004
  dbPath: /data/notification.db
  dbFileName: notification.db
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
persistence:
  size: 1Gi
global:
  kafkaBootstrap: "helep-kafka-kafka-bootstrap.helep.svc.cluster.local:9092"
  jwtSecret: "change-me"
  matcher: "nearest"
