apiVersion: apps/v1
kind: Deployment
metadata:
  name: sos-service
  namespace: helep
  labels:
    app: sos-service
    app.kubernetes.io/part-of: helep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sos-service
  template:
    metadata:
      labels:
        app: sos-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: sos-service
          image: helep/sos-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: KAFKA_BOOTSTRAP
              valueFrom:
                configMapKeyRef:
                  name: helep-config
                  key: KAFKA_BOOTSTRAP
            - name: SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: helep-config
                  key: SOS_SERVICE_PORT
            - name: DB_PATH
              value: /data/sos.db
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: helep-secret
                  key: JWT_SECRET
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8002
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sos-service-data
